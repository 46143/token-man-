services:
  # Type: web
  type: web
  name: token-refresh-bot
  env: node
  plan: free
  buildCommand: npm install
  startCommand: npm start
  autoDeploy: false
  envVars:
    - key: DISCORD_BOT_TOKEN
      sync: false
    - key: APPLICATION_ID
      sync: false
    - key: MONGODB_URI
      sync: false
    - key: CHANNEL_REFRESH
      sync: false
    - key: CHANNEL_ADD
      sync: false
    - key: CHANNEL_EXPIRED
      sync: false
